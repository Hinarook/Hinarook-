<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arène Manga — Combat</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101426;color:#fff;font-family:system-ui,Arial;overflow:hidden}canvas{display:block;width:100vw;height:100vh}#menu,#end{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#101426eF,#31205eeb);padding:16px;z-index:3}#end{display:none;background:#101426bb}#panel{max-width:850px;width:100%;background:#111827f2;border:1px solid #ffffff40;border-radius:22px;padding:22px;text-align:center;box-shadow:0 20px 80px #0009}h1{margin:4px 0 8px;font-size:clamp(24px,5vw,40px)}p{color:#dbeafe}.fighters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.pick{border:2px solid transparent;border-radius:16px;background:#26334d;color:white;padding:12px 6px;cursor:pointer;font:inherit}.pick.active{border-color:#c4b5fd;background:#3c4770}.avatar{font-size:42px;display:block}.pick small{display:block;color:#cbd5e1;margin-top:5px}button.main{border:0;border-radius:12px;padding:12px 22px;background:#7c3aed;color:white;font-weight:800;font-size:17px;cursor:pointer}#hud{position:fixed;top:12px;left:12px;right:12px;display:none;justify-content:space-between;gap:12px;pointer-events:none}.stat{background:#111827dc;border:1px solid #ffffff35;border-radius:13px;padding:9px 12px;width:min(270px,44vw)}.bar{height:13px;background:#374151;border-radius:20px;overflow:hidden}.fill{height:100%;width:100%;background:linear-gradient(90deg,#22c55e,#86efac)}.enemy .fill{background:linear-gradient(90deg,#f97316,#facc15)}.small{font-size:12px;color:#cbd5e1;margin:0 0 5px}#help{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#111827dd;border:1px solid #ffffff35;border-radius:12px;padding:9px 13px;text-align:center;font-size:12px;line-height:1.5;max-width:95vw;white-space:nowrap}#attack{position:fixed;right:18px;bottom:70px;width:78px;height:78px;border-radius:50%;background:#dc2626;color:#fff;border:3px solid #fecaca;font-weight:900;display:none;touch-action:manipulation}@media(max-width:620px){.fighters{grid-template-columns:repeat(2,1fr)}#panel{padding:15px}.pick{padding:8px 4px}.avatar{font-size:34px}#help{font-size:10px;white-space:normal;width:90vw}#attack{display:block}}
</style></head><body>
<canvas id="game"></canvas>
<div id="menu"><div id="panel"><h1>⚔️ ARÈNE MANGA</h1><p>Choisis ton combattant et entre dans l'arène !</p><div class="fighters">
<button class="pick active" data-i="0"><span class="avatar">🥷</span><b>Ninja bleu</b><small>Vitesse & énergie</small></button><button class="pick" data-i="1"><span class="avatar">🔥</span><b>Guerrier rouge</b><small>Force & puissance</small></button><button class="pick" data-i="2"><span class="avatar">🖤</span><b>Ombre noire</b><small>Technique & précision</small></button><button class="pick" data-i="3"><span class="avatar">🔮</span><b>Mage violet</b><small>Pouvoir mystique</small></button></div><button class="main" id="start">Commencer le combat !</button></div></div>
<div id="hud"><div class="stat"><div class="small" id="pname">TOI</div><div class="bar"><div class="fill" id="pbar"></div></div><div class="small" id="php">100 / 100</div></div><div class="stat enemy"><div class="small" id="ename">ADVERSAIRE</div><div class="bar"><div class="fill" id="ebar"></div></div><div class="small" id="ehp">100 / 100</div></div></div>
<div id="help" style="display:none">Déplacement : Z Q S D ou flèches · Attaque : ESPACE<br>Sur téléphone : utilise le bouton ATTAQUE</div><button id="attack">ATTAQUE</button>
<div id="end"><div id="panel"><h1 id="result">🏆 VICTOIRE !</h1><p>Bien joué, combattant !</p><button class="main" id="replay">Rejouer</button> <button class="main" id="change">Changer de personnage</button></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const roster=[{name:'Ninja bleu',color:'#2563eb',light:'#67e8f9',hair:'#172554',emoji:'🥷'},{name:'Guerrier rouge',color:'#dc2626',light:'#fbbf24',hair:'#451a03',emoji:'🔥'},{name:'Ombre noire',color:'#27272a',light:'#e5e7eb',hair:'#09090b',emoji:'🖤'},{name:'Mage violet',color:'#7c3aed',light:'#e9d5ff',hair:'#312e81',emoji:'🔮'}];let selected=0,player=null,enemy=null,pHP=100,eHP=100,active=false,ended=false,cd=0,ec=0,keys={},last=0,particles=[];
const picks=[...document.querySelectorAll('.pick')];picks.forEach(b=>b.addEventListener('click',()=>{selected=+b.dataset.i;picks.forEach(x=>x.classList.toggle('active',x===b))}));
function fighter(i,x,z){return {skin:roster[i],x,z,dir:1,flash:0,attack:0,bob:0}}
function start(){player=fighter(selected,-1.8,1.2);let ri=(selected+1+Math.floor(Math.random()*3))%4;enemy=fighter(ri,1.8,-1.2);pHP=eHP=100;cd=ec=0;particles=[];active=true;ended=false;document.getElementById('menu').style.display='none';document.getElementById('end').style.display='none';document.getElementById('hud').style.display='flex';document.getElementById('help').style.display='block';document.getElementById('pname').textContent='🛡️ '+player.skin.name;document.getElementById('ename').textContent='⚔️ '+enemy.skin.name;bars()}
document.getElementById('start').onclick=start;document.getElementById('replay').onclick=start;document.getElementById('change').onclick=()=>{active=false;document.getElementById('end').style.display='none';document.getElementById('menu').style.display='grid';document.getElementById('hud').style.display='none';document.getElementById('help').style.display='none'};
function bars(){document.getElementById('pbar').style.width=pHP+'%';document.getElementById('ebar').style.width=eHP+'%';document.getElementById('php').textContent=pHP+' / 100';document.getElementById('ehp').textContent=eHP+' / 100'}
function finish(win){if(ended)return;ended=true;active=false;document.getElementById('result').textContent=win?'🏆 VICTOIRE !':'🤖 L’ADVERSAIRE A GAGNÉ';document.getElementById('end').style.display='grid'}
function hit(){if(!active||cd>0)return;cd=.55;player.attack=.22;const dx=enemy.x-player.x,dz=enemy.z-player.z;if(Math.hypot(dx,dz)<1.65){eHP=Math.max(0,eHP-20);enemy.x+=Math.sign(dx)*.25;enemy.flash=.18;burst(enemy.x,enemy.z,enemy.skin.light);bars();if(eHP<=0)finish(true)}}
function burst(x,z,color){for(let i=0;i<12;i++)particles.push({x,z,vx:(Math.random()-.5)*4, vz:(Math.random()-.5)*4,life:.35,color})}
addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys[k]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(e.code==='Space')hit()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.getElementById('attack').addEventListener('pointerdown',e=>{e.preventDefault();hit()});
function update(dt){if(!active)return;cd=Math.max(0,cd-dt);ec=Math.max(0,ec-dt);let x=(keys.d||keys.arrowright?1:0)-(keys.q||keys.a||keys.arrowleft?1:0),z=(keys.s||keys.arrowdown?1:0)-(keys.z||keys.w||keys.arrowup?1:0);let len=Math.hypot(x,z)||1;player.x+=x/len*3.3*dt;player.z+=z/len*3.3*dt;player.x=Math.max(-3.5,Math.min(3.5,player.x));player.z=Math.max(-2.6,Math.min(2.6,player.z));if(Math.hypot(x,z)>.1)player.dir=x>=0?1:-1;
let dx=player.x-enemy.x,dz=player.z-enemy.z,dist=Math.hypot(dx,dz);if(dist>1.12){enemy.x+=dx/dist*1.45*dt;enemy.z+=dz/dist*1.45*dt;enemy.dir=dx>=0?1:-1}else if(ec<=0){ec=.95;pHP=Math.max(0,pHP-8);player.flash=.15;burst(player.x,player.z,'#fb7185');bars();if(pHP<=0)finish(false)}player.bob+=dt*9;enemy.bob+=dt*8;for(const f of [player,enemy]){f.flash=Math.max(0,f.flash-dt);f.attack=Math.max(0,f.attack-dt)}particles=particles.filter(p=>p.life>0);particles.forEach(p=>{p.x+=p.vx*dt;p.z+=p.vz*dt;p.life-=dt})}
function project(x,z,y=0){let scale=H*.105/(1+z*.10);return {x:W/2+x*scale*1.5,y:H*.58+z*scale*.7-y*scale,scale}}
function poly(points,fill,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function drawArena(){let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#8ec5ee');sky.addColorStop(.62,'#d7eafa');sky.addColorStop(1,'#53647b');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#52657d';ctx.fillRect(0,H*.56,W,H*.44);let c=project(0,0),rx=Math.min(W*.43,430),ry=Math.min(H*.22,190);ctx.beginPath();ctx.ellipse(W/2,H*.64,rx,ry,0,0,Math.PI*2);ctx.fillStyle='#34445b';ctx.fill();ctx.strokeStyle='#dbeafe';ctx.lineWidth=8;ctx.stroke();ctx.beginPath();ctx.ellipse(W/2,H*.64,rx*.82,ry*.78,0,0,Math.PI*2);ctx.fillStyle='#8192a8';ctx.fill();ctx.strokeStyle='#64748b';ctx.lineWidth=4;ctx.stroke();ctx.beginPath();ctx.ellipse(W/2,H*.64,rx*.55,ry*.52,0,0,Math.PI*2);ctx.strokeStyle='#dbeafe';ctx.lineWidth=3;ctx.stroke();for(let i=0;i<16;i++){let a=i*Math.PI/8;let x=W/2+Math.cos(a)*rx*1.02,y=H*.64+Math.sin(a)*ry*1.02;ctx.fillStyle=i%2?'#475569':'#64748b';ctx.fillRect(x-8,y-22,16,40)}}
function drawFighter(f){let p=project(f.x,f.z),s=p.scale;ctx.save();ctx.translate(p.x,p.y);ctx.scale(s,s);ctx.fillStyle='#17203355';ctx.beginPath();ctx.ellipse(0,0,27,10,0,0,Math.PI*2);ctx.fill();let bob=Math.sin(f.bob)*2;ctx.translate(0,-bob);if(f.flash>0){ctx.shadowColor='#fff';ctx.shadowBlur=24}let dir=f.dir||1;
// legs
ctx.fillStyle='#263247';round(-17, -47,13,42,6);round(4,-47,13,42,6);
// torso and belt
ctx.fillStyle=f.skin.color;round(-25,-112,50,68,13);ctx.fillStyle=f.skin.light;ctx.fillRect(-23,-58,46,7);
// arms
ctx.save();ctx.translate(-24,-100);ctx.rotate(-.18*dir);ctx.fillStyle=f.skin.color;round(-8,-2,16,47,8);ctx.restore();ctx.save();ctx.translate(24,-100);ctx.rotate(.18*dir);ctx.fillStyle=f.skin.color;round(-8,-2,16,47,8);ctx.restore();
// head
ctx.fillStyle='#f2c6a5';ctx.beginPath();ctx.ellipse(0,-133,23,26,0,0,Math.PI*2);ctx.fill();
// spiky hair
ctx.fillStyle=f.skin.hair;ctx.beginPath();ctx.moveTo(-24,-143);ctx.lineTo(-30,-166);ctx.lineTo(-12,-155);ctx.lineTo(-5,-180);ctx.lineTo(5,-157);ctx.lineTo(20,-174);ctx.lineTo(20,-153);ctx.lineTo(28,-160);ctx.lineTo(23,-135);ctx.lineTo(-23,-132);ctx.fill();
// eyes and headband
ctx.fillStyle=f.skin.light;ctx.fillRect(-23,-153,46,6);ctx.fillStyle='#111827';ctx.fillRect(-13,-137,7,3);ctx.fillRect(6,-137,7,3);
// aura ring
ctx.strokeStyle=f.skin.light;ctx.globalAlpha=.8;ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,-2,33,10,0,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;if(f.attack>0){ctx.strokeStyle='#fff';ctx.lineWidth=6;ctx.beginPath();ctx.arc(dir*34,-100,34,-.9,.9);ctx.stroke()}ctx.restore()}
function round(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function draw(){drawArena();if(player&&enemy){let arr=[player,enemy].sort((a,b)=>a.z-b.z);arr.forEach(drawFighter);particles.forEach(p=>{let q=project(p.x,p.z);ctx.globalAlpha=Math.max(0,p.life/.35);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(q.x,q.y-60,5,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1})}else{ctx.fillStyle='#172554';ctx.font='bold 28px system-ui';ctx.textAlign='center';ctx.fillText('Prépare-toi au combat !',W/2,H*.25)}}
function loop(t){let dt=Math.min((t-last)/1000||0,.04);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script></body></html>
